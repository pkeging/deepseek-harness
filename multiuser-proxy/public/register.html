<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 52kg Harness</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 36px 40px;
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    color: #1a1a2e;
    margin-bottom: 6px;
    text-align: center;
  }
  .subtitle {
    color: #6b7280;
    text-align: center;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .form-group {
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #374151;
    margin-bottom: 5px;
  }
  .input-wrap {
    position: relative;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    outline: none;
    border-color: #10b981;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
  }
  input.error {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
  }
  input.valid {
    border-color: #10b981;
  }
  .hint {
    font-size: 12px;
    margin-top: 4px;
    min-height: 16px;
  }
  .hint.error { color: #dc2626; }
  .hint.valid { color: #059669; }
  .hint.info { color: #6b7280; }
  .strength-bar {
    height: 4px;
    border-radius: 2px;
    background: #e5e7eb;
    margin-top: 6px;
    overflow: hidden;
  }
  .strength-fill {
    height: 100%;
    width: 0%;
    transition: width 0.2s, background 0.2s;
    border-radius: 2px;
  }
  .strength-weak { background: #ef4444; width: 33%; }
  .strength-ok { background: #f59e0b; width: 66%; }
  .strength-strong { background: #10b981; width: 100%; }
  .strength-text {
    font-size: 11px;
    color: #6b7280;
    margin-top: 3px;
  }
  .btn {
    width: 100%;
    padding: 11px;
    background: linear-gradient(135deg, #11998e, #38ef7d);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: 6px;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-box {
    background: #fef2f2;
    color: #dc2626;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .error-box.show { display: block; }
  .notice-box {
    background: #ecfdf5;
    color: #065f46;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 14px;
    display: none;
  }
  .notice-box.show { display: block; }
  .footer {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #6b7280;
  }
  .footer a {
    color: #10b981;
    text-decoration: none;
    font-weight: 500;
  }
  .footer a:hover { text-decoration: underline; }
  .badge {
    display: inline-block;
    background: #d1fae5;
    color: #065f46;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: middle;
    font-weight: 500;
  }
  .checklist {
    list-style: none;
    padding: 0;
    margin-top: 6px;
    font-size: 12px;
  }
  .checklist li {
    color: #9ca3af;
    padding: 2px 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .checklist li.ok {
    color: #059669;
  }
  .checklist li::before {
    content: '○';
    font-size: 10px;
  }
  .checklist li.ok::before {
    content: '✓';
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <h1>52kg Harness <span class="badge">注册</span></h1>
  <p class="subtitle">创建账号以开始使用</p>

  <div class="notice-box" id="notice"></div>
  <div class="error-box" id="error"></div>

  <form id="registerForm" novalidate>
    <div class="form-group">
      <label for="username">用户名</label>
      <div class="input-wrap">
        <input type="text" id="username" name="username" required autocomplete="username" autofocus minlength="3" maxlength="20">
      </div>
      <div class="hint info" id="usernameHint">3-20 字符，支持字母、数字、中文、下划线</div>
    </div>

    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6" maxlength="64">
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText">密码强度</div>
      <ul class="checklist" id="passwordChecklist">
        <li id="chk-length">至少 6 位</li>
        <li id="chk-mix">包含字母和数字</li>
        <li id="chk-special">包含特殊字符（可选，更强）</li>
      </ul>
    </div>

    <div class="form-group">
      <label for="confirmPassword">确认密码</label>
      <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
      <div class="hint info" id="confirmHint">请再次输入密码</div>
    </div>

    <button type="submit" class="btn" id="submitBtn" disabled>创建账号</button>
  </form>

  <div class="footer">
    已有账号？<a href="/login">立即登录</a>
  </div>
</div>

<script>
  const form = document.getElementById('registerForm')
  const usernameInput = document.getElementById('username')
  const passwordInput = document.getElementById('password')
  const confirmInput = document.getElementById('confirmPassword')
  const usernameHint = document.getElementById('usernameHint')
  const confirmHint = document.getElementById('confirmHint')
  const strengthFill = document.getElementById('strengthFill')
  const strengthText = document.getElementById('strengthText')
  const errorBox = document.getElementById('error')
  const noticeBox = document.getElementById('notice')
  const submitBtn = document.getElementById('submitBtn')
  const chkLength = document.getElementById('chk-length')
  const chkMix = document.getElementById('chk-mix')
  const chkSpecial = document.getElementById('chk-special')

  let usernameDebounce = null
  let usernameChecked = false
  let usernameAvailable = false

  async function checkBoot() {
    try {
      const res = await fetch('/api/auth/boot')
      const data = await res.json()
      if (data.is_first) {
        noticeBox.textContent = '🎉 您是第一个注册用户，将自动获得管理员权限！'
        noticeBox.classList.add('show')
      }
    } catch (e) {}
  }
  checkBoot()

  function validateUsername(u) {
    if (!u) return { ok: false, msg: '请输入用户名' }
    if (u.length < 3) return { ok: false, msg: '用户名至少 3 个字符' }
    if (u.length > 20) return { ok: false, msg: '用户名不能超过 20 个字符' }
    if (!/^[A-Za-z0-9_\u4e00-\u9fa5]+$/.test(u)) {
      return { ok: false, msg: '仅支持字母、数字、中文、下划线' }
    }
    return { ok: true, msg: '' }
  }

  function calcStrength(pwd) {
    let score = 0
    if (pwd.length >= 6) score += 1
    if (pwd.length >= 10) score += 1
    if (/[a-z]/.test(pwd) && /[A-Z]/.test(pwd)) score += 1
    if (/\d/.test(pwd)) score += 1
    if (/[^A-Za-z0-9]/.test(pwd)) score += 1
    return Math.min(score, 4)
  }

  function updatePasswordStrength() {
    const pwd = passwordInput.value
    const lenOk = pwd.length >= 6 && pwd.length <= 64
    const hasLetter = /[A-Za-z]/.test(pwd)
    const hasDigit = /\d/.test(pwd)
    const hasSpecial = /[^A-Za-z0-9]/.test(pwd)

    chkLength.classList.toggle('ok', lenOk)
    chkMix.classList.toggle('ok', hasLetter && hasDigit)
    chkSpecial.classList.toggle('ok', hasSpecial)

    const score = calcStrength(pwd)
    strengthFill.className = 'strength-fill'
    if (pwd.length === 0) {
      strengthText.textContent = '密码强度'
    } else if (score <= 1) {
      strengthFill.classList.add('strength-weak')
      strengthText.textContent = '强度：弱'
    } else if (score <= 2) {
      strengthFill.classList.add('strength-ok')
      strengthText.textContent = '强度：中等'
    } else {
      strengthFill.classList.add('strength-strong')
      strengthText.textContent = '强度：强'
    }

    updateConfirm()
    checkSubmitEnabled()
  }

  function updateConfirm() {
    const pwd = passwordInput.value
    const conf = confirmInput.value
    if (!conf) {
      confirmHint.textContent = '请再次输入密码'
      confirmHint.className = 'hint info'
      confirmInput.classList.remove('error', 'valid')
      return false
    }
    if (pwd !== conf) {
      confirmHint.textContent = '两次输入的密码不一致'
      confirmHint.className = 'hint error'
      confirmInput.classList.add('error')
      confirmInput.classList.remove('valid')
      return false
    }
    confirmHint.textContent = '密码一致 ✓'
    confirmHint.className = 'hint valid'
    confirmInput.classList.remove('error')
    confirmInput.classList.add('valid')
    return true
  }

  async function checkUsernameAvailable() {
    const u = usernameInput.value.trim()
    const v = validateUsername(u)
    if (!v.ok) {
      usernameHint.textContent = v.msg
      usernameHint.className = 'hint error'
      usernameInput.classList.add('error')
      usernameInput.classList.remove('valid')
      usernameAvailable = false
      usernameChecked = true
      checkSubmitEnabled()
      return
    }

    try {
      const res = await fetch('/api/auth/check-username?username=' + encodeURIComponent(u))
      const data = await res.json()
      if (data.available) {
        usernameHint.textContent = '用户名可用 ✓'
        usernameHint.className = 'hint valid'
        usernameInput.classList.remove('error')
        usernameInput.classList.add('valid')
        usernameAvailable = true
      } else {
        usernameHint.textContent = '该用户名已被注册'
        usernameHint.className = 'hint error'
        usernameInput.classList.add('error')
        usernameInput.classList.remove('valid')
        usernameAvailable = false
      }
    } catch (e) {
      usernameHint.textContent = '检查用户名时出错'
      usernameHint.className = 'hint error'
      usernameAvailable = false
    }
    usernameChecked = true
    checkSubmitEnabled()
  }

  function onUsernameInput() {
    usernameChecked = false
    usernameAvailable = false
    const u = usernameInput.value.trim()
    const v = validateUsername(u)
    if (!u) {
      usernameHint.textContent = '3-20 字符，支持字母、数字、中文、下划线'
      usernameHint.className = 'hint info'
      usernameInput.classList.remove('error', 'valid')
      checkSubmitEnabled()
      return
    }
    if (!v.ok) {
      usernameHint.textContent = v.msg
      usernameHint.className = 'hint error'
      usernameInput.classList.add('error')
      usernameInput.classList.remove('valid')
      checkSubmitEnabled()
      return
    }
    usernameHint.textContent = '正在检查...'
    usernameHint.className = 'hint info'
    usernameInput.classList.remove('error', 'valid')
    checkSubmitEnabled()

    clearTimeout(usernameDebounce)
    usernameDebounce = setTimeout(checkUsernameAvailable, 400)
  }

  function checkSubmitEnabled() {
    const u = usernameInput.value.trim()
    const p = passwordInput.value
    const c = confirmInput.value
    const usernameOk = usernameChecked && usernameAvailable
    const passwordOk = p.length >= 6 && p.length <= 64
    const confirmOk = p === c && c.length > 0
    submitBtn.disabled = !(usernameOk && passwordOk && confirmOk)
  }

  usernameInput.addEventListener('input', onUsernameInput)
  passwordInput.addEventListener('input', updatePasswordStrength)
  confirmInput.addEventListener('input', () => { updateConfirm(); checkSubmitEnabled() })

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    errorBox.classList.remove('show')

    const username = usernameInput.value.trim()
    const password = passwordInput.value
    const confirm = confirmInput.value

    if (password !== confirm) {
      errorBox.textContent = '两次输入的密码不一致'
      errorBox.classList.add('show')
      return
    }

    submitBtn.disabled = true
    submitBtn.textContent = '注册中...'
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      })
      const data = await res.json()
      if (res.ok) {
        window.location.href = '/'
      } else {
        errorBox.textContent = data.error || '注册失败'
        errorBox.classList.add('show')
      }
    } catch (err) {
      errorBox.textContent = '网络错误：' + err.message
      errorBox.classList.add('show')
    } finally {
      submitBtn.textContent = '创建账号'
      checkSubmitEnabled()
    }
  })
</script>
</body>
</html>
